<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Energy Aurora · Loading…</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#94a3b8;
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center}
  #s{text-align:center;padding:24px;font-size:0.95rem;line-height:1.5}
  .spin{display:inline-block;width:28px;height:28px;margin-bottom:12px;
    border:2px solid #1e293b;border-top-color:#34d399;border-radius:50%;
    animation:r .7s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .err{color:#f87171}
</style>
</head>
<body>
<div id="s">
  <div class="spin" aria-hidden="true"></div>
  <div>Đang tải Energy Aurora…</div>
  <div style="font-size:0.75rem;opacity:.7;margin-top:8px">App1.b64 → v5.4.24</div>
</div>
<script>
(async function () {
  var el = document.getElementById('s');
  try {
    var r = await fetch('App1.b64', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' khi tải App1.b64');
    var b64 = (await r.text()).replace(/\s+/g, '');
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    el.innerHTML = '<div class="err">Không tải được app.</div>'
      + '<div style="margin-top:10px;font-size:0.8rem">' + (e && e.message ? e.message : e) + '</div>'
      + '<div style="margin-top:12px;font-size:0.75rem;opacity:.8">Kiểm tra file App1.b64 trên repo hoặc mở lại trang.</div>';
  }
})();
</script>
</body>
</html>
